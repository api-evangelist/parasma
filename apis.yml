aid: parasma
name: Parasma
description: >-
  Parasma is a San Francisco based biological compute startup building
  algorithms and hardware that train living human brain cells (cortical neurons
  on a chip) to perform computation for AI workloads. Founded in 2026 by Sean
  Cole and backed by Y Combinator (Summer 2026 batch), the company grew out of
  research that taught a clump of lab-grown human neurons to play Doom, coverage
  of which appeared in Nature, The Economist, Scientific American, The Guardian
  and elsewhere. Parasma currently operates as an early-stage research company
  with a marketing and news website; it does not yet publish a public API, SDK,
  developer portal, or other machine-readable developer surface. This profile is
  tracked in the API Evangelist network as a company lead so any future
  developer platform can be captured when it ships.
